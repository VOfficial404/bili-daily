name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go vet ./...
      - run: go build ./cmd/bili-daily
      - run: go test ./...
      - name: Report retention race checks
        run: go test -race ./engine -run 'Retention|Prun|Report' -count=1
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

  # 桌面客户端的界面测试不开窗口，在 Windows 上跑（和大多数用户一样）
  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: app/go.mod

      - run: go vet ./...
      - run: go test ./...

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: mobile/go.mod

      - run: go vet ./...
      - run: go test ./...
