name: Desktop

on:
  push:
    branches: [main]
  pull_request:
    paths: ["api/**", "bili/**", "engine/**", "desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/universal" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
      - name: Install NSIS
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - run: go tool mygo build -platform "${{ matrix.platform }}"
      - name: Portable Windows archives
        if: matrix.name == 'Windows'
        run: |
          version="$(jq -r .version mygo.json)"
          for dir in build/windows-*; do
            arch="${dir#build/windows-}"
            (cd "$dir" && zip -qr "../bili-tools-desktop-${version}-windows-${arch}-portable.zip" "Bili Tools.exe" icon.png tray.png)
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            desktop/build/*/*.dmg
            desktop/build/*/*-setup-*.exe
            desktop/build/*-portable.zip
            desktop/build/*/*.deb
            desktop/build/*/*.tar.gz
