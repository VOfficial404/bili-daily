name: Mobile

# 手机 App：app/ 的 MyGo 手机入口，和桌面同一套代码

on:
  push:
    branches: [main]
  pull_request:
    paths: ["api/**", "bili/**", "client/**", "engine/**", "app/**", ".github/ios-unsigned.sh", ".github/workflows/mobile.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: app/go.mod
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006
      # 版本发布用项目固定的发布密钥（和 NSGo 版同一把，才能覆盖安装）；其他构建用调试密钥，只供测试
      - name: Build APK
        env:
          ANDROID_KEYSTORE: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEYSTORE || '' }}
          ORG_GRADLE_PROJECT_mygoKeystorePassword: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ORG_GRADLE_PROJECT_mygoKeyPassword: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEY_PASSWORD || '' }}
          ORG_GRADLE_PROJECT_mygoKeyAlias: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEY_ALIAS || '' }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ -z "$ANDROID_KEYSTORE" ] || [ -z "$ORG_GRADLE_PROJECT_mygoKeystorePassword" ] || [ -z "$ORG_GRADLE_PROJECT_mygoKeyPassword" ] || [ -z "$ORG_GRADLE_PROJECT_mygoKeyAlias" ]; then
              echo "::error::Release requires the Android signing key and passwords in repository secrets."
              exit 1
            fi
            printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.p12"
            trap 'rm -f "$RUNNER_TEMP/release.p12"' EXIT
            export ORG_GRADLE_PROJECT_mygoKeystore="$RUNNER_TEMP/release.p12"
          else
            unset ORG_GRADLE_PROJECT_mygoKeystorePassword ORG_GRADLE_PROJECT_mygoKeyPassword ORG_GRADLE_PROJECT_mygoKeyAlias
          fi
          go tool mygo build -platform android/arm64
          version="$(jq -r .version mygo.json)"
          mkdir -p build/release
          mv "build/android/$(jq -r .slug mygo.json)-$version.apk" "build/release/bili-daily-$version-android-arm64.apk"
      - name: Check signing certificate
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          apk="$(ls build/release/*.apk)"
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            want=a080b83f7c82e39c88e671cf9de37fc2910615e9cf59f3a1a496984bfe2617d1
            grep -qi "certificate SHA-256 digest: $want" "$RUNNER_TEMP/certs.txt" || { echo "::error::APK 不是用项目的发布密钥签名的，用户无法覆盖安装"; exit 1; }
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Android
          if-no-files-found: error
          path: app/build/release/*.apk

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: app/go.mod
      - name: Build unsigned IPA
        run: bash ../.github/ios-unsigned.sh "build/release/bili-daily-$(jq -r .version mygo.json)-ios-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: iOS
          if-no-files-found: error
          path: app/build/release/*-ios-unsigned.ipa
