name: Mobile

on:
  push:
    branches: [main]
  pull_request:
    paths: ["api/**", "bili/**", "client/**", "engine/**", "mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: mobile/go.mod
      # 调试包也要沿用签名，否则下一次无法覆盖安装。
      - uses: actions/cache@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          path: mobile/.nsgo/android/debug.pem
          key: android-debug-signing-v1
      - name: Build APK
        env:
          ANDROID_KEYSTORE: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEYSTORE || '' }}
          NSGO_KEYSTORE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          NSGO_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEY_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEY_ALIAS || '' }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && { [ -z "$ANDROID_KEYSTORE" ] || [ -z "$NSGO_KEYSTORE_PASSWORD" ] || [ -z "$NSGO_KEY_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; }; then
            echo "::error::Release requires the Android signing key and passwords in repository secrets."
            exit 1
          fi
          if [ -n "$ANDROID_KEYSTORE" ]; then
            printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.p12"
            trap 'rm -f "$RUNNER_TEMP/release.p12"' EXIT
            go tool nsgo build -target android_arm64 -keystore "$RUNNER_TEMP/release.p12" -key-alias "$ANDROID_KEY_ALIAS"
          else
            go tool nsgo build -target android_arm64
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Android
          if-no-files-found: error
          path: |
            mobile/dist/releases/*.apk
            mobile/dist/releases/*.apk.sha256

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: mobile/go.mod
      # 没有 provisioning profile：生成未签名 IPA，用户用 AltStore/SideStore 自己签名。
      - run: go tool nsgo build -target ios
      - name: Name unsigned IPA
        run: |
          for file in dist/releases/*-ios.ipa; do
            mv "$file" "${file%-ios.ipa}-ios-unsigned.ipa"
          done
          rm -f dist/releases/*-ios.ipa.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: iOS
          if-no-files-found: error
          path: mobile/dist/releases/*-ios-unsigned.ipa
