name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build server binaries
        run: |
          mkdir -p out
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "$os" = windows ]; then ext=.exe; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" \
              -o "out/bili-tools_${os}_${arch}${ext}" ./cmd/bili-tools
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Server
          if-no-files-found: error
          path: out/*

  desktop:
    uses: ./.github/workflows/desktop.yml
  mobile:
    uses: ./.github/workflows/mobile.yml
    secrets: inherit

  publish:
    needs: [server, desktop, mobile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          find artifacts -type f ! -name '*.sha256' -exec cp {} out/ \;
          cd out
          sha256sum * > checksums.txt
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
