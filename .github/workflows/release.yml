name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # 客户端拿自己的版本号和最新发布比；版本号没改就会一直提示「有新版本」
      - name: Check versions and changelog
        run: |
          v="${GITHUB_REF_NAME#v}"
          fail=0
          grep -q "\"version\": \"$v\"" app/mygo.json || { echo "app/mygo.json 的 version 不是 $v"; fail=1; }
          grep -q "const version = \"$v\"" app/app.go || { echo "app/app.go 的 version 不是 $v"; fail=1; }
          grep -q "^## $GITHUB_REF_NAME\$" CHANGELOG.md || { echo "CHANGELOG.md 里没有「## $GITHUB_REF_NAME」"; fail=1; }
          exit $fail
      - run: go test ./...
      - name: Build server binaries
        run: |
          mkdir -p out
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "$os" = windows ]; then ext=.exe; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" \
              -o "out/bili-daily_${os}_${arch}${ext}" ./cmd/bili-daily
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Server
          if-no-files-found: error
          path: out/*

  desktop:
    uses: ./.github/workflows/desktop.yml
  mobile:
    uses: ./.github/workflows/mobile.yml
    secrets: inherit

  publish:
    needs: [server, desktop, mobile]
    runs-on: ubuntu-latest
    steps:
      # 只取发布说明模板和更新日志
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/release-notes.md
            CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          find artifacts -type f ! -name '*.sha256' -exec cp {} out/ \;
          cd out
          sha256sum * > checksums.txt
          # 「更新了什么」放在最前（客户端里显示的就是这一段），后面是下载说明和自动生成的提交对比链接
          awk -v tag="## $GITHUB_REF_NAME" '$0 == tag {on = 1; next} on && /^## / {exit} on' ../CHANGELOG.md > ../notes.md
          printf '\n' >> ../notes.md
          cat ../.github/release-notes.md >> ../notes.md
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes-file ../notes.md --generate-notes
